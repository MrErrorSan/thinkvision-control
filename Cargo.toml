[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.8"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[workspace.dependencies]
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
    "system-tray",
] }
slint-build = "=1.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size first: the shipped binary must stay under 10 MB.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
